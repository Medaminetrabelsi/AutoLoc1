# ============================================
# Application AutoLoc - Configuration
# ============================================
spring.application.name=AutoLoc
server.port=8080

# ============================================
# Base de données MySQL (XAMPP)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# Logs
# ============================================
logging.level.org.springframework.web=INFO
logging.level.tn.esprit.autoloc=DEBUG
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n